appId: dev.osscompass.desktop
productName: OSS Compass
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: zip
  category: public.app-category.developer-tools
  identity: null
linux:
  target: AppImage
